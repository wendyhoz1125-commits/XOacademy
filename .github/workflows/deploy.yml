# Publishes the site to GitHub Pages on every push to main, and every day with fresh content from the live help center.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Refresh the content snapshot. If the live help center is unreachable, the committed snapshot is used.
      - run: node scripts/fetch-content.mjs
        continue-on-error: true
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages has no SPA routing: serving the app as the 404 page makes direct links and reloads work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
